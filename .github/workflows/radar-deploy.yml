# Mise en ligne de Normandie Business Radar sur Cloudflare Workers — lancement manuel uniquement.
# GitHub → Actions → « Radar — mise en ligne Cloudflare » → Run workflow.
# Secrets du dépôt : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (requis) ;
# RADAR_SETUP_TOKEN, INSEE_API_KEY, INPI_USERNAME, INPI_PASSWORD, PAPPERS_API_TOKEN, ANTHROPIC_API_KEY (facultatifs).
name: Radar — mise en ligne Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-deploy
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: radar/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Déployer sur Cloudflare
        run: node scripts/cf-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SETUP_TOKEN: ${{ secrets.RADAR_SETUP_TOKEN }}
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          INPI_USERNAME: ${{ secrets.INPI_USERNAME }}
          INPI_PASSWORD: ${{ secrets.INPI_PASSWORD }}
          PAPPERS_API_TOKEN: ${{ secrets.PAPPERS_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
