# Déploiement automatique et gratuit sur GitHub Pages (facultatif).
# À chaque « push » sur main : installation → vérifications → build → mise en ligne.
# Prérequis (une seule fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Une fois par mois : instantané OpenStreetMap local (commerces et artisans) remis à jour
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Annuaire OpenStreetMap de la Seine-Maritime (espace Signe & Seine). Serveur saturé : l'application interroge
      # alors Overpass en direct, la mise en ligne continue.
      - name: Instantané OpenStreetMap local
        run: npm run osm:local -- 76
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run build
        env:
          # Relais web gratuit (Cloudflare Worker, pas un secret). Une variable de dépôt du même nom le remplace :
          # Settings → Secrets and variables → Actions → Variables
          VITE_WEB_PROXY_URL: ${{ vars.VITE_WEB_PROXY_URL || 'https://paysapro-relais.paysapro-prospection.workers.dev' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
