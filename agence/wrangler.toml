# Agence — Cloudflare Workers (offre gratuite). Projet DISTINCT du relais Paysapro (aucune ressource partagée).
# Déploiement automatique : GitHub → Actions → « Agence — mise en ligne Cloudflare » (voir docs/DEPLOIEMENT.md).
# Les identifiants de la base et du stockage sont complétés au moment du déploiement par scripts/cf-deploy.mjs.
name = "agence-web"
main = "src/server/worker.ts"
compatibility_date = "2026-09-01"

# Fichiers statiques (CSS, JS, polices) servis directement par Cloudflare.
[assets]
directory = "./public"

[vars]
ENVIRONMENT = "production"
MAIL_PROVIDER = "log"   # « brevo » ou « resend » une fois le service configuré

[[d1_databases]]
binding = "DB"
database_name = "agence-web"
database_id = "A_REMPLACER"

# Fichiers privés (pièces jointes, BAT) — stockage KV non public
[[kv_namespaces]]
binding = "FILES_KV"
id = "A_REMPLACER"

# Secrets (jamais dans ce fichier) : APP_SECRET, ADMIN_SETUP_TOKEN, BREVO_API_KEY…
